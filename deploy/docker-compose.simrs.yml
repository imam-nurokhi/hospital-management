services:
  simrs-bisadibicarakan-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: simrs-bisadibicarakan:main
    container_name: simrs-bisadibicarakan-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://simrs.bisadibicarakan.com
      DATABASE_URL: ${DATABASE_URL:-postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@bisadibicarakan.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rsbisadibicarakan.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    ports:
      - "127.0.0.1:3009:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
